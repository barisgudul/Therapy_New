# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
#
# Production project ref. `supabase link` / `db push` / `functions deploy`
# target this project. (Previously pointed at the staging ref
# `xnicudjkfmxsmyxbemur`; see the launch checklist for the schema
# reconciliation steps.)
project_id = "ijtcqbxagcdgfxrgamis"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.api-gateway]
verify_jwt = true
import_map = "./functions/api-gateway/deno.json"

[functions.reset-user-data]
verify_jwt = true
import_map = "./functions/reset-user-data/deno.json"

[functions.cancel-deletion]
verify_jwt = true
import_map = "./functions/cancel-deletion/deno.json"

# RevenueCat cannot present a Supabase user JWT — this webhook authenticates via a
# shared secret (Authorization: Bearer <REVENUECAT_WEBHOOK_SECRET>) checked inside
# the function. It MUST be deployed without JWT verification or entitlement sync
# silently breaks.
[functions.revenuecat-webhook]
verify_jwt = false

# All other edge functions use the default `verify_jwt = true`. They are invoked
# either by a signed-in client (forwarding the user JWT) or by another function
# using the service-role key, both of which satisfy JWT verification.

