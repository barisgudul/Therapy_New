name: Supabase Deploy

# Manual only. `production` must be a protected GitHub Environment (manual
# approval). Do NOT enable automatic triggers: `db push` against the prod
# database is destructive and must be run with a fresh backup in hand.
on:
  workflow_dispatch:
    inputs:
      push_migrations:
        description: "Run `supabase db push` (schema migrations)"
        type: boolean
        default: false
      deploy_functions:
        description: "Run `supabase functions deploy`"
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        if: ${{ inputs.push_migrations == true }}
        run: supabase db push

      - name: Deploy edge functions
        if: ${{ inputs.deploy_functions == true }}
        run: supabase functions deploy
