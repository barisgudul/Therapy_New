name: Release iOS

# iOS store builds are blocked until an Apple Developer Program account exists.
# For now this only produces a simulator build for internal testing.
# When the Apple account is ready:
#   - add ascAppId / appleTeamId to eas.json submit.production.ios
#   - switch the profile below to `production` and add an `eas submit` step
on:
  workflow_dispatch:

jobs:
  build:
    name: EAS build (preview / simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas build --platform ios --profile preview --non-interactive --no-wait
